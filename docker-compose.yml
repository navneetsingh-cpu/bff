name: bff

x-hardening: &hardening
  read_only: true
  tmpfs:
    - /tmp:size=16m,mode=1777
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

services:
  bff:
    <<: *hardening
    build:
      context: .
      dockerfile: apps/bff/Dockerfile
    # The only published port in the stack. Put TLS termination in front of it:
    # __Host- cookies and Secure require HTTPS.
    ports:
      - "8080:3000"
    environment:
      NODE_ENV: production
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
      AZURE_CLIENT_CERT_PRIVATE_KEY: ${AZURE_CLIENT_CERT_PRIVATE_KEY}
      AZURE_CLIENT_CERT_THUMBPRINT: ${AZURE_CLIENT_CERT_THUMBPRINT}
      AZURE_SCOPES: ${AZURE_SCOPES}
      BFF_PUBLIC_ORIGIN: ${BFF_PUBLIC_ORIGIN}
      REDIRECT_URI: ${REDIRECT_URI}
      POST_LOGOUT_REDIRECT_URI: ${POST_LOGOUT_REDIRECT_URI}
      REDIS_URL: ${REDIS_URL}
      SESSION_ENC_KEY: ${SESSION_ENC_KEY}
      SESSION_IDLE_TTL_SECONDS: ${SESSION_IDLE_TTL_SECONDS}
      SESSION_ABSOLUTE_TTL_SECONDS: ${SESSION_ABSOLUTE_TTL_SECONDS}
      # Signing key stays on the BFF; the sub-apps only ever get the public half.
      INTERNAL_JWT_PRIVATE_KEY: ${INTERNAL_JWT_PRIVATE_KEY}
      INTERNAL_JWT_PUBLIC_KEY: ${INTERNAL_JWT_PUBLIC_KEY}
      SPA_BASE_URL: ${SPA_BASE_URL}
      DEV_INSECURE_COOKIE: ${DEV_INSECURE_COOKIE}
      APP_HR_ORIGIN: http://app-hr:3000
      APP_OPS_ORIGIN: http://app-ops:3000
    networks:
      - public
      - internal
    depends_on:
      redis:
        condition: service_healthy
      app-hr:
        condition: service_started
      app-ops:
        condition: service_started

  app-hr:
    <<: *hardening
    build:
      context: .
      dockerfile: apps/app-hr/Dockerfile
    environment:
      NODE_ENV: production
      INTERNAL_JWT_PUBLIC_KEY: ${INTERNAL_JWT_PUBLIC_KEY}
    networks:
      - internal

  app-ops:
    <<: *hardening
    build:
      context: .
      dockerfile: apps/app-ops/Dockerfile
    environment:
      NODE_ENV: production
      INTERNAL_JWT_PUBLIC_KEY: ${INTERNAL_JWT_PUBLIC_KEY}
    networks:
      - internal

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", ""]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - internal

networks:
  public:
    driver: bridge
  internal:
    internal: true

volumes:
  redis-data:
