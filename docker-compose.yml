name: bff-starter

# ---------------------------------------------------------------------------
# Local development topology.
#
#   host :3000  ->  bff  ->  connect | iif | handbook
#                     \
#                      `->  redis
#
# `bff` is the only service with a published port. Everything else is reachable
# only by container name on the `internal` network, so the sub-apps cannot be
# hit directly from the host — the only way in is through the proxy, which is
# the only thing that mints an assertion.
# ---------------------------------------------------------------------------

x-common-env: &common-env
  NODE_ENV: development
  INTERNAL_JWT_SECRET: ${INTERNAL_JWT_SECRET:-dev-only-not-a-real-secret-change-me}
  INTERNAL_JWT_ISSUER: ${INTERNAL_JWT_ISSUER:-bff}
  # Bind-mounted filesystems on Windows and macOS don't deliver inotify events
  # reliably; polling is what makes hot reload actually work in the container.
  WATCHPACK_POLLING: ${WATCHPACK_POLLING:-true}

x-subapp: &subapp
  restart: unless-stopped
  expose:
    - '3000'
  networks:
    - internal

services:
  redis:
    image: redis:7-alpine
    # Sessions are disposable in dev; no persistence, no RDB snapshots on disk.
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    restart: unless-stopped
    networks:
      - internal
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  bff:
    build:
      context: .
      dockerfile: apps/bff/Dockerfile
      target: dev
    restart: unless-stopped
    environment:
      <<: *common-env
      AUTH_MODE: ${AUTH_MODE:-stub}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-sid}
      SESSION_IDLE_SECONDS: ${SESSION_IDLE_SECONDS:-1800}
      SESSION_ABSOLUTE_SECONDS: ${SESSION_ABSOLUTE_SECONDS:-28800}
      INTERNAL_JWT_TTL_SECONDS: ${INTERNAL_JWT_TTL_SECONDS:-60}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      CONNECT_ORIGIN: http://connect:3000
      IIF_ORIGIN: http://iif:3000
      HANDBOOK_ORIGIN: http://handbook:3000
      # Only read when AUTH_MODE=oidc. Blank in stub mode.
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
      REDIRECT_URI: ${REDIRECT_URI:-http://localhost:3000/api/auth/callback}
      OIDC_SCOPE: ${OIDC_SCOPE:-openid profile email}
    ports:
      - '${BFF_PORT:-3000}:3000'
    volumes:
      - ./apps/bff:/app/apps/bff
      - ./packages/internal-auth:/app/packages/internal-auth
      - ./packages/session-sync:/app/packages/session-sync
      # Keep build output inside the container: it's large, churns constantly,
      # and writing it back to a Windows/macOS bind mount is slow.
      - bff_next:/app/apps/bff/.next
    depends_on:
      redis:
        condition: service_healthy
      connect:
        condition: service_started
      iif:
        condition: service_started
      handbook:
        condition: service_started
    networks:
      # `edge` carries the published port and outbound traffic (OIDC discovery
      # to login.microsoftonline.com). `internal` is how it reaches the rest.
      - edge
      - internal
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:3000/api/health']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 40s

  connect:
    <<: *subapp
    build:
      context: .
      dockerfile: apps/connect/Dockerfile
      target: dev
    environment:
      <<: *common-env
    volumes:
      - ./apps/connect:/app/apps/connect
      - ./packages/internal-auth:/app/packages/internal-auth
      - ./packages/session-sync:/app/packages/session-sync
      - connect_next:/app/apps/connect/.next

  iif:
    <<: *subapp
    build:
      context: .
      dockerfile: apps/iif/Dockerfile
      target: dev
    environment:
      <<: *common-env
    volumes:
      - ./apps/iif:/app/apps/iif
      - ./packages/internal-auth:/app/packages/internal-auth
      - ./packages/session-sync:/app/packages/session-sync
      - iif_next:/app/apps/iif/.next

  handbook:
    <<: *subapp
    build:
      context: .
      dockerfile: apps/handbook/Dockerfile
      target: dev
    environment:
      <<: *common-env
    volumes:
      - ./apps/handbook:/app/apps/handbook
      - ./packages/internal-auth:/app/packages/internal-auth
      - ./packages/session-sync:/app/packages/session-sync
      - handbook_next:/app/apps/handbook/.next

networks:
  edge:
    driver: bridge
  internal:
    driver: bridge
    # No route off the host. Redis and the sub-apps have no reason to reach the
    # internet, and nothing on the internet has a reason to reach them.
    internal: true

volumes:
  bff_next:
  connect_next:
  iif_next:
  handbook_next:
